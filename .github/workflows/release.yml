name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: tixid-bot.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: tixid-bot
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Artifacts (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $staging = "tixid-bot-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path $staging -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination "$staging/${{ matrix.bin_name }}"
          Copy-Item "config.toml.example" -Destination $staging
          Copy-Item "README.md" -Destination $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip" -Force
          echo "ARCHIVE_PATH=$staging.zip" >> $env:GITHUB_ENV

      - name: Package Linux Artifacts (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          TAG="${GITHUB_REF_NAME:-v1.0.0}"
          staging="tixid-bot-$TAG-linux-x86_64"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$staging/"
          cp "config.toml.example" "$staging/"
          cp "README.md" "$staging/"
          tar -czvf "$staging.tar.gz" -C "$staging" .
          echo "ARCHIVE_PATH=$staging.tar.gz" >> $GITHUB_ENV

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: true
